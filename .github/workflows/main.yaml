name: Main taski workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      TI__DJANGO__SECRET_KEY: test-secret-key
      TI__POSTGRES__PASSWORD: postgres
    services:
      postgres:
        image: postgres:17.8-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taski
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . --fix
      - name: Pyright
        run: uv run pyright
      - name: Django tests
        run: uv run python manage.py test
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up nodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          cd frontend/
          npm ci
      - name: Test frontend
        run: |
          cd frontend/
          npm run test
  build-and-push:
    runs-on: ubuntu-latest
    needs: [ backend-tests, frontend-tests ]
    strategy:
      matrix:
        component: [ backend, frontend, gateway ]
        include:
          - component: backend
            context: ./backend/
            tag: taski_backend
          - component: frontend
            context: ./frontend/
            tag: taski_frontend
          - component: gateway
            context: ./gateway/
            tag: taski_gateway
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.tag }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v6
      - name: Copy configs to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.PORT }}
          source: "docker-compose.production.yml"
          target: "/opt/taski"
      - name: Create .env and restart images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.PORT }}
          script: |
            cat > /opt/taski/.env  << 'EOF'
            TI__DJANGO__SECRET_KEY=${{ secrets.TI__DJANGO__SECRET_KEY }}
            TI__DJANGO__DOMAIN=${{ secrets.TI__DJANGO__DOMAIN }}
            TI__DJANGO__HEALTHCHECK_PATH=${{ secrets.TI__DJANGO__HEALTHCHECK_PATH }}
            TI__DJANGO__ADMIN_PATH=${{ secrets.TI__DJANGO__ADMIN_PATH }}
            TI__POSTGRES__HOST=${{ secrets.TI__POSTGRES__HOST }}
            TI__POSTGRES__DB=${{ secrets.TI__POSTGRES__DB }}
            TI__POSTGRES__USER=${{ secrets.TI__POSTGRES__USER }}
            TI__POSTGRES__PASSWORD=${{ secrets.TI__POSTGRES__PASSWORD }}
            TI__POSTGRES__PORT=${{ secrets.TI__POSTGRES__PORT }}
            EOF
            cd /opt/taski
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -af
  notify:
    runs-on: ubuntu-latest
    needs: post-deploy-tests
    if: always()
    steps:
      - name: Notify success
        if: needs.post-deploy-tests.result == 'success'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Taski deployed successfully!
            Commit: ${{ github.event.head_commit.message }}
            Author: ${{ github.event.head_commit.author.name }}
      - name: Notify failure
        if: needs.post-deploy-tests.result != 'success'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Deploy failed!
            Commit: ${{ github.event.head_commit.message }}
            Info: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}